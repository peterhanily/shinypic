<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">How ShinyPic creates an HDR JPEG</title>
  <desc id="desc">A seven-step flow from a local SDR photo through highlight selection and PQ encoding to an HDR display.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#172033"/><stop offset="1" stop-color="#29375a"/></linearGradient>
    <linearGradient id="shine" x1="0" x2="1"><stop stop-color="#ff6b35"/><stop offset="1" stop-color="#ff4d80"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="360" rx="32" fill="url(#bg)"/>
  <text x="54" y="62" fill="#fff" font-family="system-ui,sans-serif" font-size="28" font-weight="800">A brighter-than-white JPEG, made entirely in your browser</text>
  <text x="54" y="92" fill="#bfc8dd" font-family="system-ui,sans-serif" font-size="15">No upload. No account. The saved file carries standard Rec.2100 PQ colour information.</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <g transform="translate(56 130)"><rect width="132" height="130" rx="18" fill="#fff" opacity=".08"/><rect x="19" y="18" width="94" height="62" rx="10" fill="#244b7e"/><circle cx="88" cy="40" r="8" fill="#ffce6e"/><text x="66" y="104" fill="#fff" font-size="14" font-weight="700">1 · Photo</text><text x="66" y="122" fill="#aeb8cf" font-size="11">local pixels</text></g>
    <path d="M200 195h28" stroke="#697795" stroke-width="3" stroke-linecap="round"/><path d="m222 187 9 8-9 8" fill="none" stroke="#697795" stroke-width="3"/>
    <g transform="translate(240 130)"><rect width="132" height="130" rx="18" fill="#fff" opacity=".08"/><circle cx="66" cy="49" r="30" fill="#131b2e"/><g fill="#ff4d80"><circle cx="52" cy="43" r="6"/><circle cx="77" cy="35" r="4"/><circle cx="72" cy="60" r="8"/></g><text x="66" y="104" fill="#fff" font-size="14" font-weight="700">2 · Select</text><text x="66" y="122" fill="#aeb8cf" font-size="11">magic, tap, paint</text></g>
    <path d="M384 195h28" stroke="#697795" stroke-width="3" stroke-linecap="round"/><path d="m406 187 9 8-9 8" fill="none" stroke="#697795" stroke-width="3"/>
    <g transform="translate(424 130)"><rect width="132" height="130" rx="18" fill="#fff" opacity=".08"/><path d="M38 68h56M48 55h36M57 42h18" stroke="#79b3ff" stroke-width="6" stroke-linecap="round"/><text x="66" y="104" fill="#fff" font-size="14" font-weight="700">3 · Linearise</text><text x="66" y="122" fill="#aeb8cf" font-size="11">sRGB → Rec.2020</text></g>
    <path d="M568 195h28" stroke="#697795" stroke-width="3" stroke-linecap="round"/><path d="m590 187 9 8-9 8" fill="none" stroke="#697795" stroke-width="3"/>
    <g transform="translate(608 130)"><rect width="132" height="130" rx="18" fill="#fff" opacity=".08"/><text x="66" y="61" fill="#fff" font-size="25" font-weight="900" filter="url(#glow)">6,800</text><text x="66" y="78" fill="#ffaf93" font-size="11">nominal nits</text><text x="66" y="104" fill="#fff" font-size="14" font-weight="700">4 · Boost</text><text x="66" y="122" fill="#aeb8cf" font-size="11">small highlights</text></g>
    <path d="M752 195h28" stroke="#697795" stroke-width="3" stroke-linecap="round"/><path d="m774 187 9 8-9 8" fill="none" stroke="#697795" stroke-width="3"/>
    <g transform="translate(792 130)"><rect width="132" height="130" rx="18" fill="#fff" opacity=".08"/><path d="M34 70c12-4 19-35 32-35s20 31 32 35" fill="none" stroke="url(#shine)" stroke-width="6" stroke-linecap="round"/><text x="66" y="104" fill="#fff" font-size="14" font-weight="700">5 · PQ encode</text><text x="66" y="122" fill="#aeb8cf" font-size="11">absolute luminance</text></g>
    <path d="M936 195h28" stroke="#697795" stroke-width="3" stroke-linecap="round"/><path d="m958 187 9 8-9 8" fill="none" stroke="#697795" stroke-width="3"/>
    <g transform="translate(976 130)"><rect width="168" height="130" rx="18" fill="#fff" opacity=".08"/><rect x="42" y="18" width="84" height="62" rx="8" fill="#10182a" stroke="#dbe4f8" stroke-width="3"/><path d="M66 49h36" stroke="#fff" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/><text x="84" y="104" fill="#fff" font-size="14" font-weight="700">6 · HDR JPEG</text><text x="84" y="122" fill="#aeb8cf" font-size="11">Rec.2100 PQ ICC</text></g>
  </g>
  <rect x="54" y="294" width="1092" height="1" fill="#fff" opacity=".12"/>
  <text x="54" y="326" fill="#dce4f4" font-family="system-ui,sans-serif" font-size="13">Compatible display: highlights can emit more light than interface white</text>
  <text x="1146" y="326" fill="#aeb8cf" font-family="system-ui,sans-serif" font-size="13" text-anchor="end">SDR display: honest glow preview + separate SDR export</text>
</svg>
