name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node.js 20
        uses: actions/setup-node@1e60f620b9541d0c243d0eccc7e0b1b0a2c8f858 # v4.0.3
        with:
          node-version: 20

      - name: Verify committed binary and demo assets
        run: sha256sum --check --strict checksums.sha256

      - name: Run unit tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Build standalone site
        run: npm run build:single

      - name: Check build entry points
        run: |
          test -s dist/index.html
          test -s dist-single/index.html
          test -s dist-single/shinypic-standalone.html
